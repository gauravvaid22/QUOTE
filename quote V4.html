<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen selection:bg-blue-500/30 selection:text-blue-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ICONS ---
    const IconPlus = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconHistory = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
    const IconSettings = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
    const IconUpload = () => <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;
    const IconTrash = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
    const IconFileText = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
    const IconDownload = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
    const IconImage = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>;
    const IconShield = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>;
    const IconLayers = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>;
    const IconCalendar = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
    const IconClock = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
    const IconChartBar = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>;

    // Updated Logo for Dark Mode Visibility
    const DefaultLogo = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" className="max-h-28 w-auto object-contain">
        <g transform="translate(10, 10)">
          <path d="M50 0 L93.3 25 L93.3 75 L50 100 L6.7 75 L6.7 25 Z" fill="none" stroke="#E4E4E7" strokeWidth="4" strokeLinejoin="round"/>
          <path d="M50 0 L50 50 L93.3 25 M50 50 L50 100 M50 50 L6.7 25" fill="none" stroke="#E4E4E7" strokeWidth="4" strokeLinejoin="round"/>
          <circle cx="50" cy="50" r="6" fill="#E4E4E7" />
        </g>
        <text x="120" y="45" fontFamily="Arial, sans-serif" fontSize="36" fontWeight="900" fill="#E4E4E7" letterSpacing="2">CUSTOM BUILD</text>
        <text x="120" y="80" fontFamily="Arial, sans-serif" fontSize="32" fontWeight="300" fill="#E4E4E7" letterSpacing="8">STUDIO</text>
        <text x="120" y="105" fontFamily="Arial, sans-serif" fontSize="10" fontWeight="700" fill="#A1A1AA" letterSpacing="3">PRECISION. DESIGN. INNOVATION.</text>
      </svg>
    );

    // Logo explicitly for PDF generation (force black ink)
    const PDFLogo = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" className="max-h-40 w-auto object-contain">
        <g transform="translate(10, 10)">
          <path d="M50 0 L93.3 25 L93.3 75 L50 100 L6.7 75 L6.7 25 Z" fill="none" stroke="#000" strokeWidth="4" strokeLinejoin="round"/>
          <path d="M50 0 L50 50 L93.3 25 M50 50 L50 100 M50 50 L6.7 25" fill="none" stroke="#000" strokeWidth="4" strokeLinejoin="round"/>
          <circle cx="50" cy="50" r="6" fill="#000" />
        </g>
        <text x="120" y="45" fontFamily="Arial, sans-serif" fontSize="36" fontWeight="900" fill="#000" letterSpacing="2">CUSTOM BUILD</text>
        <text x="120" y="80" fontFamily="Arial, sans-serif" fontSize="32" fontWeight="300" fill="#000" letterSpacing="8">STUDIO</text>
        <text x="120" y="105" fontFamily="Arial, sans-serif" fontSize="10" fontWeight="700" fill="#666" letterSpacing="3">PRECISION. DESIGN. INNOVATION.</text>
      </svg>
    );

    function App() {
      const [activeTab, setActiveTab] = useState('quote');

      const defaultSettings = {
        machines: [{ id: '1', name: 'Bambu Lab X1C', hourlyRate: 3.00 }],
        materials: [{ 
            id: '1', name: 'PETG', costPerKg: 25.00, 
            spools1kg: 1, spools3kg: 0, spools5kg: 0, openGrams: 500, 
            needsDrying: false, dryingHours: 0 
        }],
        shop: {
          laborHourlyRate: 60.00, prepFeePerPlate: 5.00, defaultMargin: 50, designHourlyRate: 80.00,
          logoBase64: null, nextInvoiceNum: 277,
          printBuffer: 1.5, orderLeadDays: 3 
        },
        aiPrompts: {
          quote: "Hello {{CustomerName}},\n\nPlease find the attached quotation for your project: {{ProjectName}}.\n\nTotal Price: ${{Price}}\n\nPlease let me know if you would like to proceed with this order.\n\nBest regards,\n\nGaurav\nCustom Build Studio",
          invoice: "Hello {{CustomerName}},\n\nYour project '{{ProjectName}}' is now complete and ready for pickup at the shop!\n\nInvoice #: {{InvoiceNum}}\nTotal Amount Due: ${{Price}}\n\nPlease let me know when you plan to stop by, or if you need shipping arranged.\n\nThank you for choosing Custom Build Studio.\n\nBest regards,\n\nGaurav"
        }
      };

      const calcMaterialTotal = (m) => {
          if (!m) return 0;
          return ((m.spools1kg || 0) * 1000) + ((m.spools3kg || 0) * 3000) + ((m.spools5kg || 0) * 5000) + (m.openGrams || 0);
      };

      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('cbs_settings');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            const migratedMaterials = (parsed.materials || defaultSettings.materials).map(m => ({
                ...m,
                spools1kg: m.spools1kg || 0,
                spools3kg: m.spools3kg || 0,
                spools5kg: m.spools5kg || 0,
                openGrams: m.openGrams !== undefined ? m.openGrams : (m.stockGrams || 0),
                needsDrying: m.needsDrying || false,
                dryingHours: m.dryingHours || 0
            }));
            return {
              machines: parsed.machines || defaultSettings.machines,
              materials: migratedMaterials,
              shop: { ...defaultSettings.shop, ...parsed.shop },
              aiPrompts: { ...defaultSettings.aiPrompts, ...parsed.aiPrompts }
            };
          } catch(e) { return defaultSettings; }
        }
        return defaultSettings;
      });

      const [jobs, setJobs] = useState(() => {
        const saved = localStorage.getItem('cbs_jobs');
        if (saved) {
            const parsed = JSON.parse(saved);
            return parsed.map(job => {
                const fallbackDate = new Date(job.date);
                fallbackDate.setDate(fallbackDate.getDate() + 7);
                const sDate = job.startDate || job.date; 
                
                let prodStatus = job.prodStatus;
                let payStatus = job.paymentStatus;
                let amtPaid = job.amountPaid || 0;

                if (!prodStatus || !payStatus) {
                    if (job.status === 'Paid') { prodStatus = 'Approved'; payStatus = 'Paid'; amtPaid = job.price; }
                    else if (job.status === 'Partial') { prodStatus = 'Approved'; payStatus = 'Partial'; }
                    else if (job.status === 'Approved') { prodStatus = 'Approved'; payStatus = 'Unpaid'; }
                    else if (job.status === 'Completed') { prodStatus = 'Completed'; payStatus = 'Paid'; amtPaid = job.price; }
                    else { prodStatus = 'Quoted'; payStatus = 'Unpaid'; }
                }

                if (payStatus === 'Paid' && amtPaid === 0) amtPaid = job.price;

                if (!job.parts) {
                    return {
                        ...job,
                        startDate: sDate, dueDate: job.dueDate || fallbackDate.toISOString(), 
                        amountPaid: amtPaid, paymentStatus: payStatus, prodStatus: prodStatus,
                        parts: [{
                            id: job.id + '-migrated', name: job.projectName,
                            machineName: job.machineName || 'Unknown Machine', materialName: job.materialName || 'Unknown Material',
                            time: job.printTimeHours || 0, weight: job.filamentWeightGrams || 0,
                            plates: job.plates || 1, postMins: 0, baseCost: job.cost || 0,
                            inStock: true, needsDrying: false,
                            productionStatus: prodStatus === 'Completed' ? 'Completed' : 'Ready to Print',
                            stockDeducted: prodStatus === 'Completed'
                        }]
                    };
                }
                return { ...job, startDate: sDate, dueDate: job.dueDate || fallbackDate.toISOString(), amountPaid: amtPaid, paymentStatus: payStatus, prodStatus: prodStatus };
            });
        }
        return [];
      });

      const [currentParts, setCurrentParts] = useState([]); 
      const [partName, setPartName] = useState('');
      const [fileName, setFileName] = useState('');
      const [printTimeHours, setPrintTimeHours] = useState(0);
      const [filamentWeightGrams, setFilamentWeightGrams] = useState(0);
      const [plates, setPlates] = useState(1);
      const [postProcessingMinutes, setPostProcessingMinutes] = useState(0);
      const [selectedMachineId, setSelectedMachineId] = useState('');
      const [selectedMaterialId, setSelectedMaterialId] = useState('');
      
      const [customerName, setCustomerName] = useState('');
      const [projectName, setProjectName] = useState('');
      
      const [orderStartDate, setOrderStartDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [orderDueDate, setOrderDueDate] = useState(() => {
          const d = new Date(); d.setDate(d.getDate() + 7);
          return d.toISOString().split('T')[0];
      });
      const [scheduleNotice, setScheduleNotice] = useState('');

      const [orderImages, setOrderImages] = useState([]);
      const [invoiceNumInput, setInvoiceNumInput] = useState(settings.shop?.nextInvoiceNum || 277);
      const [designHours, setDesignHours] = useState(0);
      const [riskValue, setRiskValue] = useState(0); 
      const [riskType, setRiskType] = useState('%'); 
      const [adjustment, setAdjustment] = useState(0); 
      
      const [generatedEmail, setGeneratedEmail] = useState('');
      const [invoiceJob, setInvoiceJob] = useState(null); 
      const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);

      useEffect(() => {
        if (!selectedMachineId && settings.machines?.length > 0) setSelectedMachineId(settings.machines[0].id);
        if (!selectedMaterialId && settings.materials?.length > 0) setSelectedMaterialId(settings.materials[0].id);
      }, [settings]);

      useEffect(() => { localStorage.setItem('cbs_settings', JSON.stringify(settings)); }, [settings]);
      useEffect(() => { localStorage.setItem('cbs_jobs', JSON.stringify(jobs)); }, [jobs]);

      useEffect(() => {
        if (activeTab === 'quote') {
          const highestInv = jobs.reduce((max, job) => Math.max(max, parseInt(job.invoiceNum) || 0), 0);
          const suggestedNum = Math.max(highestInv + 1, settings.shop.nextInvoiceNum || 277);
          setInvoiceNumInput(suggestedNum);
        }
      }, [jobs, activeTab, settings.shop.nextInvoiceNum]);

      const activeMaterial = settings.materials?.find(m => m.id === selectedMaterialId);
      const claimedGramsInCart = currentParts
          .filter(p => p.materialName === activeMaterial?.name)
          .reduce((sum, p) => sum + (p.weight * p.plates), 0);
          
      const reqGrams = filamentWeightGrams * plates;
      const totalAvailable = activeMaterial ? calcMaterialTotal(activeMaterial) - claimedGramsInCart : 0;
      const isMaterialInStock = activeMaterial ? reqGrams <= totalAvailable : true;

      const getMachineBacklogs = () => {
          const backlogs = {};
          jobs.forEach(job => {
              if (job.prodStatus === 'Approved') { 
                  job.parts.forEach(part => {
                      if (part.productionStatus !== 'Completed') {
                          const m = part.machineName || 'Unknown Machine';
                          if (!backlogs[m]) backlogs[m] = 0;
                          backlogs[m] += (part.time * part.plates);
                      }
                  });
              }
          });
          return backlogs;
      };

      useEffect(() => {
         const currentBacklogs = getMachineBacklogs();
         let maxMaterialDelay = 0;
         const machineNewLoads = {};
         let totalPostMins = 0;

         const allEvalParts = [...currentParts];
         if (printTimeHours > 0 || filamentWeightGrams > 0) {
             const stagingMachine = settings.machines?.find(m => m.id === selectedMachineId);
             allEvalParts.push({ 
                 machineName: stagingMachine?.name || 'Unknown',
                 time: printTimeHours, plates, postMins: postProcessingMinutes, 
                 inStock: isMaterialInStock, 
                 needsDrying: activeMaterial?.needsDrying || false,
                 dryingHours: activeMaterial?.dryingHours || 0
             });
         }

         if (allEvalParts.length === 0) {
             setOrderStartDate(new Date().toISOString().split('T')[0]);
             const d = new Date(); d.setDate(d.getDate() + 7);
             setOrderDueDate(d.toISOString().split('T')[0]);
             setScheduleNotice('');
             return;
         }

         allEvalParts.forEach(p => {
             let matDelay = 0;
             if (!p.inStock) matDelay += (settings.shop.orderLeadDays || 3);
             if (p.needsDrying) matDelay += (p.dryingHours / 24);
             if (matDelay > maxMaterialDelay) maxMaterialDelay = matDelay;

             const m = p.machineName;
             if (!machineNewLoads[m]) machineNewLoads[m] = 0;
             machineNewLoads[m] += (p.time * p.plates);

             totalPostMins += (p.postMins * p.plates);
         });

         let longestMachinePath = 0;
         let bottleneckMachine = '';
         
         Object.keys(machineNewLoads).forEach(m => {
             const existingBacklog = currentBacklogs[m] || 0;
             const newLoad = machineNewLoads[m];
             
             const totalHrs = existingBacklog + newLoad;
             const printDays = (totalHrs * (settings.shop.printBuffer || 1.5)) / 24;
             
             if (printDays > longestMachinePath) {
                 longestMachinePath = printDays;
                 bottleneckMachine = m;
             }
         });

         const postDays = totalPostMins / 60 / 24;
         const effectiveLeadDays = Math.max(maxMaterialDelay, longestMachinePath) + postDays + 1; 

         const sDate = new Date();
         sDate.setDate(sDate.getDate() + Math.ceil(maxMaterialDelay));
         setOrderStartDate(sDate.toISOString().split('T')[0]);

         const dDate = new Date();
         dDate.setDate(dDate.getDate() + Math.ceil(effectiveLeadDays));
         setOrderDueDate(dDate.toISOString().split('T')[0]);

         if (currentBacklogs[bottleneckMachine] > 0) {
             setScheduleNotice(`Notice: Pushed back due to ${currentBacklogs[bottleneckMachine].toFixed(1)}h backlog on ${bottleneckMachine}.`);
         } else if (maxMaterialDelay > 0) {
             setScheduleNotice(`Notice: Pushed back due to Material Constraints.`);
         } else {
             setScheduleNotice('');
         }

      }, [currentParts, printTimeHours, filamentWeightGrams, plates, postProcessingMinutes, selectedMaterialId, selectedMachineId, isMaterialInStock, activeMaterial, settings.machines, settings.shop.printBuffer, settings.shop.orderLeadDays]);

      const processGCode = (text, name) => {
        setFileName(name);
        const cleanName = name.replace('.gcode', '').replace(/_/g, ' ');
        setPartName(cleanName);
        if (!projectName && currentParts.length === 0) setProjectName(`Order: ${cleanName}`);

        let timeInHours = 0; let weightInGrams = 0;
        const head = text.slice(0, 50000); const tail = text.length > 50000 ? text.slice(-50000) : "";
        const searchArea = head + "\n" + tail;
        
        const weightRegexes = [
          /total filament weight \[g\][=:\s]+([0-9.]+)/i, /filament_weight[=:\s]+([0-9.]+)/i,             
          /filament used \[g\][=:\s]+([0-9.]+)/i, /total filament used \[g\][=:\s]+([0-9.]+)/i,
          /filament weight \[g\][=:\s]+([0-9.]+)/i, /filament used.*?[,:]\s*([0-9.]+)\s*g/i,         
          /weight \[g\][=:\s]+([0-9.]+)/i, /filament used[=:\s]+([0-9.]+)/i
        ];
        
        for (let regex of weightRegexes) {
          const match = searchArea.match(regex); 
          if (match && match[1]) { weightInGrams = parseFloat(match[1]); break; }
        }

        const timeLines = searchArea.match(/(?:estimated|model|print|total).*time.*?[=:]\s*([^\r\n]+)/ig);
        if (timeLines && timeLines.length > 0) {
          for (let line of timeLines) {
            let d = 0, h = 0, m = 0, s = 0;
            const dM = line.match(/(\d+)\s*d/i); const hM = line.match(/(\d+)\s*h/i);
            const mM = line.match(/(\d+)\s*m/i); const sM = line.match(/(\d+)\s*s/i);
            
            if (dM) d = parseInt(dM[1]); if (hM) h = parseInt(hM[1]);
            if (mM) m = parseInt(mM[1]); if (sM) s = parseInt(sM[1]);

            if (d || h || m || s) { timeInHours = (d * 24) + h + (m / 60) + (s / 3600); break; } 
            else {
              const colonMatch = line.match(/(\d+):(\d+):(\d+)/);
              if (colonMatch) { timeInHours = parseInt(colonMatch[1]) + (parseInt(colonMatch[2]) / 60) + (parseInt(colonMatch[3]) / 3600); break; }
            }
          }
        }
        if (timeInHours === 0) {
           const curaMatch = searchArea.match(/;TIME:(\d+)/i);
           if (curaMatch && curaMatch[1]) timeInHours = parseInt(curaMatch[1]) / 3600;
        }

        setPrintTimeHours(parseFloat(timeInHours.toFixed(2)));
        setFilamentWeightGrams(parseFloat(weightInGrams.toFixed(2)));
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => processGCode(event.target.result, file.name);
        reader.readAsText(file); e.target.value = null; 
      };

      const handleOrderImageUpload = async (e) => {
        const files = Array.from(e.target.files); if (!files.length) return;
        const processImage = (file) => new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (event) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                const MAX = 600; let w = img.width, h = img.height;
                if (w > MAX || h > MAX) { if (w > h) { h = h * (MAX / w); w = MAX; } else { w = w * (MAX / h); h = MAX; } }
                canvas.width = w; canvas.height = h;
                ctx.fillStyle = '#FFF'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
                resolve(canvas.toDataURL('image/jpeg', 0.7)); 
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
        const newImages = await Promise.all(files.map(processImage));
        setOrderImages(prev => [...prev, ...newImages]); e.target.value = null;
      };

      const removeOrderImage = (index) => setOrderImages(orderImages.filter((_, i) => i !== index));

      const calcSinglePartCost = (machineId, materialId, hrs, grams, qty, postMins) => {
        const mac = settings.machines.find(m => m.id === machineId) || settings.machines[0];
        const mat = settings.materials.find(m => m.id === materialId) || settings.materials[0];
        const matCost = mat ? qty * (grams / 1000) * mat.costPerKg : 0;
        const macCost = mac ? qty * hrs * mac.hourlyRate : 0;
        const prepCost = qty * settings.shop.prepFeePerPlate;
        const postCost = qty * (postMins / 60) * settings.shop.laborHourlyRate;
        return matCost + macCost + prepCost + postCost;
      };

      const stagedPartBaseCost = (printTimeHours > 0 || filamentWeightGrams > 0) 
        ? calcSinglePartCost(selectedMachineId, selectedMaterialId, printTimeHours, filamentWeightGrams, plates, postProcessingMinutes) : 0;

      const calcTotalBaseMfg = () => currentParts.reduce((sum, p) => sum + p.baseCost, 0) + stagedPartBaseCost;

      const calcTotalItemized = () => {
         let mat = 0; let mac = 0; let prep = 0; let post = 0;
         if (printTimeHours > 0 || filamentWeightGrams > 0) {
           const machine = settings.machines?.find(m => m.id === selectedMachineId) || settings.machines?.[0];
           const material = settings.materials?.find(m => m.id === selectedMaterialId) || settings.materials?.[0];
           mat += material ? plates * (filamentWeightGrams / 1000) * material.costPerKg : 0;
           mac += machine ? plates * printTimeHours * machine.hourlyRate : 0;
           prep += plates * settings.shop.prepFeePerPlate;
           post += plates * (postProcessingMinutes / 60) * settings.shop.laborHourlyRate;
         }
         currentParts.forEach(p => {
            const mtrl = settings.materials.find(m => m.name === p.materialName);
            const mchn = settings.machines.find(m => m.name === p.machineName);
            mat += mtrl ? p.plates * (p.weight / 1000) * mtrl.costPerKg : 0;
            mac += mchn ? p.plates * p.time * mchn.hourlyRate : 0;
            prep += p.plates * settings.shop.prepFeePerPlate;
            post += p.plates * (p.postMins / 60) * settings.shop.laborHourlyRate;
         });
         return { mat, mac, prep, post };
      };
      const totals = calcTotalItemized();

      const calcMarginAmount = () => calcTotalBaseMfg() * (settings.shop.defaultMargin / 100);
      const calcRiskAmount = () => riskType === '%' ? calcTotalBaseMfg() * (riskValue / 100) : riskValue;
      const calcMarkupPrice = () => calcTotalBaseMfg() + calcMarginAmount() + calcRiskAmount();
      const calcDesignCost = () => designHours * (settings.shop.designHourlyRate || 80);
      const calcFinalPrice = () => calcMarkupPrice() + calcDesignCost() + adjustment;
      const getMarkedUpPartPrice = (baseCost) => baseCost * (1 + (settings.shop.defaultMargin / 100));

      const addPartToOrder = () => {
        if (!partName || (printTimeHours === 0 && filamentWeightGrams === 0)) return;

        const machine = settings.machines.find(m => m.id === selectedMachineId);
        
        let initialStatus = 'Ready to Print';
        if (!isMaterialInStock) initialStatus = 'Pending Material';
        else if (activeMaterial?.needsDrying) initialStatus = 'Drying / Prep';

        const newPart = {
            id: Date.now().toString() + Math.random().toString(36).substr(2, 9), 
            name: partName, fileName: fileName,
            machineName: machine?.name || 'Unknown Machine', materialName: activeMaterial?.name || 'Unknown Material',
            time: printTimeHours, weight: filamentWeightGrams, plates: plates, postMins: postProcessingMinutes, 
            baseCost: stagedPartBaseCost, productionStatus: initialStatus, 
            inStock: isMaterialInStock, needsDrying: activeMaterial?.needsDrying || false, dryingHours: activeMaterial?.dryingHours || 0,
            stockDeducted: false
        };
        setCurrentParts([...currentParts, newPart]);
        setPartName(''); setFileName(''); setPrintTimeHours(0); setFilamentWeightGrams(0); setPlates(1); setPostProcessingMinutes(0);
      };

      const removePart = (id) => setCurrentParts(currentParts.filter(p => p.id !== id));

      const saveOrder = () => {
        if (!customerName || !projectName || !orderDueDate || !orderStartDate) return;

        let finalParts = [...currentParts];
        if (printTimeHours > 0 || filamentWeightGrams > 0) {
            const machine = settings.machines.find(m => m.id === selectedMachineId);
            let initialStatus = 'Ready to Print';
            if (!isMaterialInStock) initialStatus = 'Pending Material';
            else if (activeMaterial?.needsDrying) initialStatus = 'Drying / Prep';

            finalParts.push({
                id: Date.now().toString() + Math.random().toString(36).substr(2, 9), 
                name: partName || 'Un-named Part', fileName: fileName,
                machineName: machine?.name || 'Unknown Machine', materialName: activeMaterial?.name || 'Unknown Material',
                time: printTimeHours, weight: filamentWeightGrams, plates: plates, postMins: postProcessingMinutes, 
                baseCost: stagedPartBaseCost, productionStatus: initialStatus, 
                inStock: isMaterialInStock, needsDrying: activeMaterial?.needsDrying || false, dryingHours: activeMaterial?.dryingHours || 0,
                stockDeducted: false
            });
        }

        if (finalParts.length === 0) return;

        const finalBaseCost = finalParts.reduce((sum, p) => sum + p.baseCost, 0);
        const finalMarginAmt = finalBaseCost * (settings.shop.defaultMargin / 100);
        const finalRiskAmt = riskType === '%' ? finalBaseCost * (riskValue / 100) : riskValue;
        const finalMarkup = finalBaseCost + finalMarginAmt + finalRiskAmt;
        const finalDesign = designHours * (settings.shop.designHourlyRate || 80);
        const finalTotalPrice = finalMarkup + finalDesign + adjustment;

        const sDate = new Date(orderStartDate + 'T12:00:00');
        const dDate = new Date(orderDueDate + 'T12:00:00');

        const newJob = {
          id: Date.now().toString() + Math.random().toString(36).substr(2, 9), 
          invoiceNum: invoiceNumInput, date: new Date().toISOString(),
          startDate: sDate.toISOString(), dueDate: dDate.toISOString(),
          customerName, projectName, parts: finalParts, orderImages, designHours, riskValue, riskType, adjustment,
          marginValue: settings.shop.defaultMargin, marginType: '%',
          amountPaid: 0, paymentStatus: 'Unpaid',
          designCost: finalDesign, printPrice: finalMarkup, cost: finalBaseCost, price: finalTotalPrice, prodStatus: 'Quoted'
        };

        setJobs([newJob, ...jobs]);
        setSettings(prev => ({...prev, shop: {...prev.shop, nextInvoiceNum: parseInt(invoiceNumInput) + 1}}));
        
        setCurrentParts([]); setPartName(''); setFileName(''); setPrintTimeHours(0); setFilamentWeightGrams(0); setPlates(1); setPostProcessingMinutes(0);
        setCustomerName(''); setProjectName(''); setOrderImages([]); setDesignHours(0); setRiskValue(0); setAdjustment(0);
        
        const rDate = new Date(); setOrderStartDate(rDate.toISOString().split('T')[0]);
        rDate.setDate(rDate.getDate() + 7); setOrderDueDate(rDate.toISOString().split('T')[0]);

        setActiveTab('history');
      };

      const adjustMaterialStock = (materialName, gramsToChange) => {
          setSettings(prev => ({
              ...prev,
              materials: prev.materials.map(m => 
                  m.name === materialName ? { ...m, openGrams: (m.openGrams || 0) + gramsToChange } : m
              )
          }));
      };

      const updateJobDate = (jobId, field, newDateStr) => {
          const d = new Date(newDateStr + 'T12:00:00').toISOString();
          setJobs(jobs.map(j => j.id === jobId ? { ...j, [field]: d } : j));
      };

      const updateJobProdStatus = (jobId, newProdStatus) => {
          const updatedJobs = jobs.map(j => {
              if (j.id === jobId) {
                  let updatedParts = j.parts;
                  
                  if (newProdStatus === 'Completed') {
                      updatedParts = j.parts.map(part => {
                          let stockDeducted = part.stockDeducted || false;
                          if (!stockDeducted) {
                              adjustMaterialStock(part.materialName, -(part.weight * part.plates));
                              stockDeducted = true;
                          }
                          return { ...part, productionStatus: 'Completed', stockDeducted };
                      });
                  } 
                  else if (j.prodStatus === 'Completed' && newProdStatus !== 'Completed') {
                      updatedParts = j.parts.map(part => {
                          let stockDeducted = part.stockDeducted || false;
                          if (stockDeducted) {
                              adjustMaterialStock(part.materialName, (part.weight * part.plates));
                              stockDeducted = false;
                          }
                          return { ...part, productionStatus: 'Ready to Print', stockDeducted };
                      });
                  }

                  return { ...j, prodStatus: newProdStatus, parts: updatedParts };
              }
              return j;
          });
          setJobs(updatedJobs);
      };

      const updateJobPayStatus = (jobId, newPayStatus) => {
          setJobs(jobs.map(j => {
              if (j.id === jobId) {
                  let amt = j.amountPaid;
                  if (newPayStatus === 'Unpaid') amt = 0;
                  if (newPayStatus === 'Paid') amt = j.price;
                  return { ...j, paymentStatus: newPayStatus, amountPaid: amt };
              }
              return j;
          }));
      };

      const updateJobAmountPaid = (jobId, value) => {
          const amt = parseFloat(value) || 0;
          setJobs(jobs.map(j => {
              if (j.id === jobId) {
                  let payStatus = j.paymentStatus;
                  if (amt >= j.price - 0.01 && j.price > 0) payStatus = 'Paid';
                  else if (amt > 0) payStatus = 'Partial';
                  else payStatus = 'Unpaid';
                  return { ...j, amountPaid: amt, paymentStatus: payStatus };
              }
              return j;
          }));
      };

      const updatePartProductionStatus = (jobId, partId, newStatus) => {
          const updatedJobs = jobs.map(job => {
              if (job.id === jobId) {
                  let allCompleted = true;
                  const updatedParts = job.parts.map(part => {
                      if (part.id === partId) {
                          const wasCompleted = part.productionStatus === 'Completed';
                          const isCompleted = newStatus === 'Completed';
                          let stockDeducted = part.stockDeducted || false;

                          if (!wasCompleted && isCompleted && !stockDeducted) {
                              adjustMaterialStock(part.materialName, -(part.weight * part.plates));
                              stockDeducted = true;
                          } else if (wasCompleted && !isCompleted && stockDeducted) {
                              adjustMaterialStock(part.materialName, (part.weight * part.plates));
                              stockDeducted = false;
                          }

                          if (!isCompleted) allCompleted = false;
                          return { ...part, productionStatus: newStatus, stockDeducted };
                      }
                      if (part.productionStatus !== 'Completed') allCompleted = false;
                      return part;
                  });
                  
                  let newJobStatus = job.prodStatus;
                  if (allCompleted && updatedParts.length > 0) {
                      newJobStatus = 'Completed';
                  } else if (newJobStatus === 'Completed' && !allCompleted) {
                      newJobStatus = 'Approved';
                  }
                  
                  return { ...job, parts: updatedParts, prodStatus: newJobStatus };
              }
              return job;
          });
          setJobs(updatedJobs);
      };

      const reassignPartMachine = (jobId, partId, newMachineName) => {
          const updatedJobs = jobs.map(job => {
              if (job.id === jobId) {
                  const updatedParts = job.parts.map(part => {
                      if (part.id === partId) return { ...part, machineName: newMachineName };
                      return part;
                  });
                  return { ...job, parts: updatedParts };
              }
              return job;
          });
          setJobs(updatedJobs);
      };

      const reassignPartMaterial = (jobId, partId, newMaterialName) => {
          const updatedJobs = jobs.map(job => {
              if (job.id === jobId) {
                  const updatedParts = job.parts.map(part => {
                      if (part.id === partId) {
                          const newMat = settings.materials.find(m => m.name === newMaterialName);
                          return { 
                              ...part, 
                              materialName: newMaterialName,
                              needsDrying: newMat ? newMat.needsDrying : part.needsDrying,
                              dryingHours: newMat ? newMat.dryingHours : part.dryingHours
                          };
                      }
                      return part;
                  });
                  return { ...job, parts: updatedParts };
              }
              return job;
          });
          setJobs(updatedJobs);
      };

      const getQueueByMachine = () => {
          const queue = {};
          settings.machines.forEach(m => queue[m.name] = { totalTime: 0, parts: [] });

          jobs.forEach(job => {
              if (job.prodStatus === 'Approved') {
                  job.parts.forEach(part => {
                      if (part.productionStatus !== 'Completed') {
                          const machineName = part.machineName || 'Unknown Machine';
                          if (!queue[machineName]) queue[machineName] = { totalTime: 0, parts: [] };
                          
                          queue[machineName].parts.push({
                              ...part,
                              jobId: job.id,
                              jobCustomer: job.customerName,
                              jobInvoice: job.invoiceNum,
                              jobStartDate: job.startDate,
                              jobDueDate: job.dueDate
                          });
                          queue[machineName].totalTime += (part.time * part.plates);
                      }
                  });
              }
          });

          Object.keys(queue).forEach(key => { queue[key].parts.sort((a, b) => new Date(a.jobDueDate) - new Date(b.jobDueDate)); });
          return queue;
      };

      const generateEmailLocally = (type, jobData = null) => {
        const data = jobData || { customerName, projectName, price: calcFinalPrice(), invoiceNum: invoiceNumInput, date: new Date().toISOString() };
        let template = type === 'quote' ? settings.aiPrompts.quote : settings.aiPrompts.invoice;
        let res = template
          .replace(/\{\{CustomerName\}\}/g, data.customerName || "Customer")
          .replace(/\{\{ProjectName\}\}/g, data.projectName || "Project")
          .replace(/\{\{Price\}\}/g, (data.price || 0).toFixed(2))
          .replace(/\{\{InvoiceNum\}\}/g, data.invoiceNum || "INV")
          .replace(/\{\{Date\}\}/g, data.date ? new Date(data.date).toLocaleDateString() : new Date().toLocaleDateString());
        setGeneratedEmail(res);
      };

      const copyToClipboard = () => {
        const el = document.createElement("textarea"); el.value = generatedEmail; 
        document.body.appendChild(el); el.select(); 
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(el);
      };

      const backupData = () => {
        const dataStr = JSON.stringify({ settings, jobs }, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `Shop_Backup_${new Date().toISOString().split('T')[0]}.json`; a.click();
      };

      const restoreData = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.settings && data.jobs) { setSettings(data.settings); setJobs(data.jobs); }
          } catch (err) {}
        };
        reader.readAsText(file);
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
            const MAX = 800; let w = img.width, h = img.height;
            if (w > MAX) { h = h * (MAX / w); w = MAX; }
            canvas.width = w; canvas.height = h; ctx.fillStyle = '#FFF'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
            setSettings(prev => ({...prev, shop: {...prev.shop, logoBase64: canvas.toDataURL('image/jpeg', 0.85)}}));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file); 
      };

      const handleDownloadPDF = (job) => {
        setIsGeneratingPDF(true); setInvoiceJob(job);
        setTimeout(() => {
          const el = document.getElementById('pdf-invoice-container');
          const type = job.prodStatus === 'Quoted' ? 'Quotation' : job.paymentStatus === 'Paid' || job.paymentStatus === 'Partial' ? 'Receipt' : 'Invoice';
          const opt = { 
              margin: 0, filename: `${type}_${job.invoiceNum}_${job.customerName}.pdf`, 
              image: { type: 'jpeg', quality: 1 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } 
          };
          html2pdf().set(opt).from(el).save().then(() => { setInvoiceJob(null); setIsGeneratingPDF(false); });
        }, 500);
      };

      return (
        <div className="flex flex-col h-screen overflow-hidden text-zinc-100 font-sans">
          
          {/* NAVIGATION (Glassmorphism & Sticky) */}
          <nav className="bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800/50 p-4 shrink-0 flex items-center justify-between shadow-lg shadow-black/20 relative z-20 transition-all">
            <h1 className="text-xl font-black uppercase tracking-tight text-white flex items-center gap-2">
              <span className="bg-blue-600 p-1.5 rounded-lg shadow-lg shadow-blue-600/30"><IconLayers /></span>
              Custom Build Studio
            </h1>
            <div className="flex gap-2">
              <button onClick={() => setActiveTab('quote')} className={`px-4 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wide transition-all duration-200 ease-out flex items-center gap-1.5 ${activeTab === 'quote' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40' : 'bg-transparent text-zinc-400 hover:text-white hover:bg-zinc-800/50 hover:-translate-y-0.5'}`}><IconPlus/> Order Builder</button>
              <button onClick={() => setActiveTab('schedule')} className={`px-4 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wide transition-all duration-200 ease-out flex items-center gap-1.5 ${activeTab === 'schedule' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40' : 'bg-transparent text-zinc-400 hover:text-white hover:bg-zinc-800/50 hover:-translate-y-0.5'}`}><IconLayers/> Production</button>
              <button onClick={() => setActiveTab('history')} className={`px-4 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wide transition-all duration-200 ease-out flex items-center gap-1.5 ${activeTab === 'history' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40' : 'bg-transparent text-zinc-400 hover:text-white hover:bg-zinc-800/50 hover:-translate-y-0.5'}`}><IconHistory/> Dashboard</button>
              <button onClick={() => setActiveTab('settings')} className={`px-4 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wide transition-all duration-200 ease-out flex items-center gap-1.5 ${activeTab === 'settings' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/40' : 'bg-transparent text-zinc-400 hover:text-white hover:bg-zinc-800/50 hover:-translate-y-0.5'}`}><IconSettings/> Settings</button>
            </div>
          </nav>

          <main className="flex-1 p-6 lg:p-8 overflow-y-auto custom-scrollbar relative">
            <div className="max-w-6xl mx-auto pb-12">
              
              {/* TAB 1: QUOTE GENERATOR */}
              {activeTab === 'quote' && (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-in fade-in slide-in-from-bottom-4 duration-300 ease-out">
                  <div className="lg:col-span-7 space-y-6">
                    
                    {/* Modern Dropzone */}
                    <div className="bg-zinc-900/40 rounded-2xl border-2 border-dashed border-zinc-700/60 p-8 text-center hover:border-blue-500/50 hover:bg-blue-500/5 relative group transition-all duration-300 ease-out shadow-sm">
                      <input type="file" accept=".gcode" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                      <div className="bg-zinc-800/50 h-16 w-16 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 group-hover:bg-blue-600/20 transition-all duration-300">
                         <IconUpload className="text-zinc-400 group-hover:text-blue-400 transition-colors" />
                      </div>
                      <h3 className="font-bold text-zinc-300 mt-2 uppercase tracking-widest text-xs group-hover:text-blue-300 transition-colors">Drop G-Code to Add Part</h3>
                      <p className="text-xs text-zinc-500 mt-2 font-medium">Or click to browse your files</p>
                    </div>

                    <div className="bg-zinc-900 rounded-2xl border border-zinc-800 shadow-xl shadow-black/20 relative overflow-hidden">
                      <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                      <div className="p-8">
                          <h2 className="text-xs font-black text-zinc-400 uppercase tracking-widest mb-6 border-b border-zinc-800/50 pb-3 flex justify-between items-center">
                              <span>Part Configuration</span>
                              {fileName && <span className="text-[10px] text-blue-400 font-mono bg-blue-900/20 px-2 py-0.5 rounded-full border border-blue-800/30 normal-case">{fileName}</span>}
                          </h2>
                          
                          <div className="mb-5">
                            <label className="block text-[10px] text-zinc-500 uppercase font-black mb-1.5">Part Name</label>
                            <input type="text" value={partName} onChange={(e) => setPartName(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl py-2.5 px-4 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all placeholder:text-zinc-600" placeholder="e.g. Enclosure Base" />
                          </div>

                          <div className="grid grid-cols-2 gap-5 mb-5">
                            <div>
                                <label className="block text-[10px] text-zinc-500 uppercase font-black mb-1.5">Machine</label>
                                <select value={selectedMachineId} onChange={(e) => setSelectedMachineId(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl py-2.5 px-4 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all appearance-none cursor-pointer">
                                    {settings.machines?.map(m => <option key={m.id} value={m.id}>{m.name} (${m.hourlyRate}/hr)</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-[10px] text-zinc-500 uppercase font-black mb-1.5">Material</label>
                                <select value={selectedMaterialId} onChange={(e) => setSelectedMaterialId(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl py-2.5 px-4 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all appearance-none cursor-pointer">
                                    {settings.materials?.map(m => <option key={m.id} value={m.id}>{m.name} (${m.costPerKg}/kg)</option>)}
                                </select>
                                <div className="text-[9px] mt-2 flex justify-between font-bold text-zinc-500 px-1">
                                    <span>Stock: {totalAvailable}g</span>
                                    <span className={!isMaterialInStock ? 'text-rose-400 animate-pulse drop-shadow-[0_0_5px_rgba(225,29,72,0.8)]' : 'text-zinc-400'}>Req: {reqGrams}g</span>
                                </div>
                            </div>
                            <div><label className="block text-[10px] text-zinc-500 uppercase font-black mb-1.5">Time (Hrs)</label><input type="number" step="0.01" value={printTimeHours} onChange={(e) => setPrintTimeHours(parseFloat(e.target.value) || 0)} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl py-2.5 px-4 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all" /></div>
                            <div><label className="block text-[10px] text-zinc-500 uppercase font-black mb-1.5">Weight (g)</label><input type="number" step="0.01" value={filamentWeightGrams} onChange={(e) => setFilamentWeightGrams(parseFloat(e.target.value) || 0)} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl py-2.5 px-4 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all" /></div>
                            <div><label className="block text-[10px] text-zinc-500 uppercase font-black mb-1.5 flex items-center gap-1">Quantity <span className="text-blue-500">*</span></label><input type="number" value={plates} onChange={(e) => setPlates(parseInt(e.target.value) || 1)} className="w-full bg-zinc-950 border border-blue-900/50 rounded-xl py-2.5 px-4 text-sm text-white font-bold focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all" /></div>

                           <span className="text-[10px] text-zinc-500 uppercase font-black tracking-widest mr-2">Variables:</span>
                           {['{{CustomerName}}', '{{ProjectName}}', '{{Price}}', '{{InvoiceNum}}', '{{Date}}'].map(v => (
                             <code key={v} className="text-[10px] bg-blue-950/30 text-blue-300 px-2 py-1 rounded-md border border-blue-800/40 font-mono">{v}</code>
                           ))}
                      </div>
                      <div className="space-y-8">
                        <div>
                            <label className="block text-[10px] font-black text-zinc-400 uppercase mb-3 tracking-widest">Quote Message Configuration</label>
                            <textarea rows="5" value={settings.aiPrompts?.quote} onChange={(e) => setSettings({...settings, aiPrompts: {...settings.aiPrompts, quote: e.target.value}})} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-5 text-sm text-zinc-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-medium leading-relaxed shadow-inner transition-all"></textarea>
                        </div>
                        <div>
                            <label className="block text-[10px] font-black text-zinc-400 uppercase mb-3 tracking-widest">Completion / Invoice Message Configuration</label>
                            <textarea rows="5" value={settings.aiPrompts?.invoice} onChange={(e) => setSettings({...settings, aiPrompts: {...settings.aiPrompts, invoice: e.target.value}})} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-5 text-sm text-zinc-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-medium leading-relaxed shadow-inner transition-all"></textarea>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL: EMAIL DRAFT */}
              {generatedEmail && (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-in fade-in duration-200">
                  <div className="bg-zinc-900 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl border border-zinc-700 animate-in zoom-in-95 duration-300 ease-out">
                    <div className="bg-zinc-950 px-6 py-5 border-b border-zinc-800 flex justify-between items-center">
                        <h3 className="font-black text-white uppercase text-[10px] tracking-[0.2em] flex items-center gap-2"><IconFileText/> Drafted Message</h3>
                        <button onClick={() => setGeneratedEmail('')} className="text-zinc-500 hover:text-white font-black text-lg transition-colors bg-zinc-900 hover:bg-zinc-800 h-8 w-8 rounded-full flex items-center justify-center">&times;</button>
                    </div>
                    <textarea readOnly value={generatedEmail} className="w-full h-80 bg-zinc-900 p-8 text-zinc-200 focus:outline-none text-sm leading-relaxed font-sans font-medium custom-scrollbar"></textarea>
                    <div className="bg-zinc-950 p-5 border-t border-zinc-800 flex justify-end gap-4">
                        <button onClick={() => setGeneratedEmail('')} className="px-6 py-2.5 text-xs font-bold uppercase tracking-widest text-zinc-400 hover:text-white transition-colors">Close</button>
                        <button onClick={copyToClipboard} className="bg-blue-600 hover:bg-blue-500 text-white px-8 py-2.5 rounded-xl text-xs font-bold uppercase tracking-widest shadow-lg shadow-blue-900/40 active:scale-95 transition-all">Copy to Clipboard</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>

          {/* HIDDEN PDF TEMPLATE (PRINT ENGINE) */}
          <div className="fixed top-0 left-0 -z-50 opacity-0 pointer-events-none">
            {invoiceJob && (
              <div id="pdf-invoice-container" className="bg-white text-black p-12 font-sans w-[816px] min-h-[1056px] box-border flex flex-col">
                <div className="flex justify-between items-start border-b-4 border-black pb-8 mb-8">
                  <div className="max-w-[60%]">{settings.shop.logoBase64 ? <img src={settings.shop.logoBase64} alt="Shop Logo" className="max-h-40 max-w-full object-contain" /> : <PDFLogo />}</div>
                  <div className="text-right">
                    <h2 className="text-5xl font-black text-black mb-2 m-0 uppercase tracking-widest leading-none">
                      {invoiceJob.prodStatus === 'Quoted' ? 'QUOTATION' : invoiceJob.paymentStatus === 'Paid' || invoiceJob.paymentStatus === 'Partial' ? 'RECEIPT' : 'INVOICE'}
                    </h2>
                    <p className="font-black text-2xl text-black m-0 mt-3 tracking-tighter">#{invoiceJob.invoiceNum}</p>
                    <p className="text-xs font-black text-gray-800 m-0 mt-1 uppercase tracking-widest">{new Date(invoiceJob.date).toLocaleDateString()}</p>
                  </div>
                </div>
                <div className="mb-12"><p className="text-[10px] font-black text-gray-400 mb-1 m-0 uppercase tracking-widest">Issuing To:</p><p className="text-3xl font-black uppercase text-black m-0 leading-none">{invoiceJob.customerName}</p><p className="text-sm font-bold text-gray-500 mt-2 uppercase tracking-widest">Project: {invoiceJob.projectName}</p></div>
                
                <table className="w-full mb-16 border-collapse">
                  <thead>
                    <tr className="border-b-4 border-black">
                      <th className="text-left py-3 font-black text-xs text-black uppercase tracking-widest w-[60%]">Item Description</th>
                      <th className="text-center py-3 font-black text-xs text-black uppercase tracking-widest w-[20%]">Unit</th>
                      <th className="text-right py-3 font-black text-xs text-black uppercase tracking-widest w-[20%]">Amount</th>
                    </tr>
                  </thead>
                  <tbody>
                    {invoiceJob.parts?.map((p, i) => {
                       const totalPrintPrice = invoiceJob.price - (invoiceJob.designCost || 0);
                       const partDisplayPrice = invoiceJob.cost > 0 ? (p.baseCost / invoiceJob.cost) * totalPrintPrice : (totalPrintPrice / invoiceJob.parts.length);
                       return (
                         <tr key={i} className="border-b border-gray-200">
                           <td className="py-5 font-black text-lg text-black">
                               {p.name}
                               <span className="block text-xs text-gray-500 font-bold uppercase mt-1 tracking-widest">{p.materialName}</span>
                           </td>
                           <td className="text-center py-5 font-bold text-black text-lg">x{p.plates}</td>
                           <td className="text-right py-5 font-black text-xl text-black">${partDisplayPrice.toFixed(2)}</td>
                         </tr>
                       )
                    })}

                    {!invoiceJob.parts && (invoiceJob.printPrice > 0 || (invoiceJob.printPrice === undefined && invoiceJob.price > 0 && !invoiceJob.designCost)) && (
                      <tr className="border-b-2 border-gray-200">
                        <td className="py-6 font-black text-lg text-black">
                            {invoiceJob.projectName} {invoiceJob.designHours > 0 ? '- 3D MANUFACTURING' : ''}
                        </td>
                        <td className="text-center py-6 font-bold text-black text-lg">x{invoiceJob.plates || 1}</td>
                        <td className="text-right py-6 font-black text-xl text-black">${(invoiceJob.price - (invoiceJob.designCost || 0)).toFixed(2)}</td>
                      </tr>
                    )}

                    {invoiceJob.designHours > 0 && (
                      <tr className="border-b border-gray-200">
                        <td className="py-4 font-black text-lg text-black">CAD ENGINEERING SERVICE</td>
                        <td className="text-center py-4 font-bold text-black text-lg">{invoiceJob.designHours} HRS</td>
                        <td className="text-right py-4 font-black text-xl text-black">${(invoiceJob.designCost || 0).toFixed(2)}</td>
                      </tr>
                    )}
                  </tbody>
                </table>

                <div className="flex justify-between items-end mt-auto pt-16 border-t-2 border-black">
                  <div className="text-xs text-black font-black uppercase leading-tight space-y-1"><p className="mb-2 text-xl font-black tracking-tighter">Custom Build Studio</p><p>EMAIL: Custombuildstudio@gmail.com</p><p>CustomBuildStudio.ca</p><p>780-203-0081</p><p className="pt-4 text-gray-400 font-bold">Registration: 756745410</p></div>
                  
                  <div className="w-[300px]">
                    {invoiceJob.prodStatus === 'Quoted' ? (
                        <div className="flex justify-between py-4 border-t-2 border-black">
                            <span className="font-black uppercase text-xl text-black tracking-tighter">Grand Total</span>
                            <span className="font-black text-4xl text-black leading-none">${invoiceJob.price.toFixed(2)}</span>
                        </div>
                    ) : (
                        <>
                            <div className="flex justify-between py-2 border-b-2 border-gray-300"><span className="font-bold text-gray-500 uppercase text-[10px] tracking-widest">Total Valuation</span><span className="font-black text-lg text-black">${invoiceJob.price.toFixed(2)}</span></div>
                            {invoiceJob.amountPaid > 0 && (
                                <div className="flex justify-between py-2 border-b-2 border-gray-300"><span className="font-bold text-gray-500 uppercase text-[10px] tracking-widest">Amount Paid</span><span className="font-black text-lg text-black">${(invoiceJob.amountPaid || 0).toFixed(2)}</span></div>
                            )}
                            <div className="flex justify-between py-4">
                                <span className="font-black uppercase text-xl text-black tracking-tighter">
                                    {invoiceJob.amountPaid >= (invoiceJob.price - 0.01) && invoiceJob.price > 0 ? 'Paid in Full' : 'Balance Due'}
                                </span>
                                <span className="font-black text-4xl text-black leading-none">${Math.max(0, invoiceJob.price - (invoiceJob.amountPaid || 0)).toFixed(2)}</span>
                            </div>
                            {invoiceJob.dueDate && (
                                <div className="flex justify-between pt-2 mt-4 border-t-4 border-gray-200">
                                    <span className="font-bold text-gray-500 uppercase text-[10px] tracking-widest">Target Completion:</span>
                                    <span className="font-black text-sm text-black">{new Date(invoiceJob.dueDate).toLocaleDateString()}</span>
                                </div>
                            )}
                        </>
                    )}
                  </div>
                </div>

                {/* PAGE 2: REFERENCE IMAGES (SMART GRID) */}
                {(() => {
                  const imagesToRender = invoiceJob.orderImages?.length > 0 ? invoiceJob.orderImages : (invoiceJob.orderImage ? [invoiceJob.orderImage] : []);
                  if (imagesToRender.length === 0) return null;
                  
                  return (
                    <div style={{ pageBreakBefore: 'always', paddingTop: '40px' }} className="mt-12 break-before-page">
                       <h3 className="text-xl font-black uppercase tracking-widest text-black border-b-2 border-black pb-2 mb-8">Reference Images: {invoiceJob.projectName}</h3>
                       
                       <div style={{ display: 'flex', flexWrap: 'wrap', gap: '20px', justifyContent: 'center' }}>
                           {imagesToRender.map((img, idx) => {
                               const isSingle = imagesToRender.length === 1;
                               const width = isSingle ? '100%' : 'calc(50% - 10px)'; 
                               const maxHeight = isSingle ? '800px' : '400px';
                               return (
                                   <div key={idx} style={{ width: width, display: 'flex', justifyContent: 'center', marginBottom: '20px' }}>
                                       <img src={img} alt={`Reference ${idx+1}`} style={{ maxHeight: maxHeight, maxWidth: '100%', objectFit: 'contain' }} />
                                   </div>
                               )
                           })}
                       </div>
                    </div>
                  );
                })()}

              </div>
            )}
          </div>
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
